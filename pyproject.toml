[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-bc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "einops>=0.8.1",
    "flax>=0.12.1",
    "jax[cuda13]>=0.8.1",
    "lerobot[feetech,pusht]>=0.4.2",
    "matplotlib>=3.10.8",
    "orbax-checkpoint>=0.11.31",
    "tyro>=1.0.3",
    "wandb[media]>=0.21.4",
]

[tool.ruff]
line-length = 88
target-version = "py311"

select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # isort
]

fix = true

[tool.basedpyright]
typeCheckingMode = "basic"

reportMissingTypeStubs = "none"
reportOptionalSubscript = "none"
reportUnusedVariable = "none"
reportUnusedCallResult = "none"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]
